function shader(type, src) {

  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);

  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);

  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));

float hashu(uint x){ x^=x>>16; x*=0x7feb352dU; x^=x>>15; x*=0x846ca68bU; x^=x>>16; return float(x)/4294967295.0; }

const PARTICLE_VS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uPos, uCol;
uniform int uFrom, uTo, uTW, uTH;
uniform float uP, uStag, uTurb, uSwirl, uTime, uPx, uScale, uEase, uIntensity, uAspect;
uniform mat4 uProj, uView;
uniform vec3 uMouse;
out vec3 vCol;
${NOISE}
vec3 anim(vec3 p, float flag, float r, float t, inout float b){
  if (flag > 0.5 && flag < 1.5) {            // steam: rise, sway, fade
    float h = fract((p.y - 0.5) / 1.5 + t * 0.09);
    p.y = 0.5 + h * 1.5;
    p.x += sin(h * 6.0 + t * 1.1 + r * 6.2831) * 0.13 * h + snoise(vec3(p.x * 2.0, h * 3.0 - t * 0.5, r * 9.0)) * 0.09 * h;

    p.xz = rot(t * 0.35 / (0.35 + rad)) * p.xz;

  int id = gl_VertexID;
  ivec2 c = ivec2(id % uTW, id / uTW);

  vec4 pb = texelFetch(uPos, c + ivec2(0, uTo * uTH), 0);
  vec4 ca = texelFetch(uCol, c + ivec2(0, uFrom * uTH), 0);
  vec4 cb = texelFetch(uCol, c + ivec2(0, uTo * uTH), 0);

  float r2 = hashu(uint(id) * 2654435761u + 1013904223u);
  float ba = 1.0, bb = 1.0;
  vec3 A = anim(pa.xyz, ca.a, r, uTime, ba);
  vec3 B = anim(pb.xyz, cb.a, r, uTime, bb);

  vec4 cp = uProj * vp;

    vec2 ndc = cp.xy / cp.w;
    vec2 dm = (ndc - uMouse.xy) * vec2(uAspect, 1.0);
    float dl = length(dm);

  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
  let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx; // cross((0,1,0), z)
  l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
  let yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const rx = [xx * cr + yx * sr, xy * cr + yy * sr, xz * cr + yz * sr];
  const ry = [yx * cr - xx * sr, yy * cr - xy * sr, yz * cr - xz * sr];
  [xx, xy, xz] = rx; [yx, yy, yz] = ry;
  return new Float32Array([
    xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1,
  ]);
}
const smooth = t => t * t * (3 - 2 * t);
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function sceneAt(t) { let s = 0; for (let i = 0; i < SC.length; i++) if (SC[i].t <= t) s = i; return s; }
function camOf(s, t) { const c = SC[s].cam, dt = t - SC[s].t; return [c.d, c.yaw + c.drift * dt, c.pitch, c.roll, c.ty]; }
function camera(t, s) {
  if (s === 0) return camOf(0, t);
  const k = easeIO(clamp((t - SC[s].t) / (SC[s].dur * 1.3), 0, 1));
  const a = camOf(s - 1, t), b = camOf(s, t);
  return a.map((v, i) => mix(v, b[i], k));
}

/* ─────────────────────────  Captions & UI  ───────────────────────── */
const $ = id => document.getElementById(id);
const capEl = $('cap');
let capTimer = 0;
function spanify(el, text, base) {
  el.textContent = '';
  let i = 0;
  for (const phrase of text.match(/[^、]+、?/g) || []) {
    const ph = document.createElement('span');
    ph.className = 'ph';
    for (const ch of phrase) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.animationDelay = (base + i++ * 0.045) + 's';
      ph.appendChild(s);
    }
    el.appendChild(ph);
  }
}
function showCaption(s) {
  clearTimeout(capTimer);
  capEl.classList.add('out');
  const S = SC[s];
  if (!S.ja) return;
  capTimer = setTimeout(() => {
    $('capNo').textContent = String(Math.min(s, CHAPTERS - 1)).padStart(2, '0');
    $('capLabel').textContent = S.label;
    spanify($('capJa'), S.ja, 0);
    const en = $('capEn'), da = $('capData');
    en.textContent = S.en; da.textContent = S.data;
    for (const el of [en, da]) { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); }
    en.style.animationDelay = '.5s'; da.style.animationDelay = '.8s';
    capEl.classList.remove('out');
  }, 450);
}

const segs = $('segs');
const segEls = [];
for (let i = 0; i < CHAPTERS; i++) {
  const end = i === CHAPTERS - 1 ? LOOP : SC[i + 1].t;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'seg';
  b.style.setProperty('--w', (end - SC[i].t).toFixed(2));
  b.setAttribute('aria-label', 'Chapter ' + String(i).padStart(2, '0') + ' ' + SC[i].label);
  b.innerHTML = '<i></i><span>' + String(i).padStart(2, '0') + ' ' + SC[i].label + '</span>';
  b.addEventListener('click', () => jump(i));
  segs.appendChild(b); segEls.push(b);
}
$('pc').textContent = NSTR + ' particles';

let T = 0, playing = true, lastScene = -1;
const qT = parseFloat(new URLSearchParams(location.search).get('t'));
if (qT >= 0 && qT < LOOP) T = qT;
function jump(i) { T = SC[i].t + (i === 0 ? 0 : 0.001); prevT = T; }
function togglePlay() { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; }
$('play').addEventListener('click', togglePlay);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') jump((Math.min(sceneAt(T), CHAPTERS - 1) + 1) % CHAPTERS);
  else if (e.code === 'ArrowLeft') jump((Math.min(sceneAt(T), CHAPTERS - 1) + CHAPTERS - 1) % CHAPTERS);
});

const mouse = { x: 0, y: 0, z: 0, target: 0 };
function pointer(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height * 2 - 1);
  mouse.target = 1; mouse.last = performance.now();
}
canvas.addEventListener('pointermove', pointer);
canvas.addEventListener('pointerdown', pointer);
canvas.addEventListener('pointerleave', () => { mouse.target = 0; });

/* ─────────────────────────  Sound (synthesised)  ───────────────────────── */
const CHORDS = [[38, 45, 50, 57, 62], [38, 50, 57, 62, 66], [34, 46, 53, 58, 62], [36, 48, 55, 60, 63],
  [41, 48, 53, 57, 64], [43, 50, 55, 59, 62], [38, 50, 57, 62, 64], [38, 50, 57, 61, 66], [38, 45, 50, 57, 62]];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const AU = { ctx: null, on: false };
function audioInit() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ctx.destination);
  const conv = ctx.createConvolver();
  const len = ctx.sampleRate * 3.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  conv.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.55; conv.connect(wet); wet.connect(master);
  const bus = ctx.createGain(); bus.connect(master); bus.connect(conv);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = 0.8;
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 0.06; lfoG.gain.value = 380;
  lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
  const padG = ctx.createGain(); padG.gain.value = 0.045; lp.connect(padG); padG.connect(bus);
  const voices = [];
  for (let v = 0; v < 5; v++) {
    const pair = [-7, 7].map(det => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = det + (v - 2) * 1.5; o.connect(lp); o.start(); return o; });
    voices.push(pair);
  }
  Object.assign(AU, { ctx, master, bus, nb, voices });
}
function setChord(s, when) {
  const notes = CHORDS[s], t = AU.ctx.currentTime + (when || 0);
  AU.voices.forEach((pair, k) => pair.forEach(o => o.frequency.setTargetAtTime(hz(notes[k % notes.length]), t, 0.5)));
}
function noiseSrc() { const n = AU.ctx.createBufferSource(); n.buffer = AU.nb; n.loop = true; return n; }
function boom(str) {
  const { ctx, master, bus } = AU, t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(34, t + 1.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9 * str, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 2.3);
  const n = noiseSrc(), f = ctx.createBiquadFilter(), ng = ctx.createGain();
  f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + 1.2);
  ng.gain.setValueAtTime(0.45 * str, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  n.connect(f); f.connect(ng); ng.connect(bus); n.start(t); n.stop(t + 1.5);
}
function whoosh(dur) {
  const { ctx, bus } = AU, t = ctx.currentTime;
  const n = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(220, t); f.frequency.exponentialRampToValueAtTime(2800, t + dur * 0.75); f.frequency.exponentialRampToValueAtTime(600, t + dur * 1.2);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.25);
  n.connect(f); f.connect(g); g.connect(bus); n.start(t); n.stop(t + dur * 1.3);
}
function bell(m, delay) {
  const { ctx, bus } = AU, t = ctx.currentTime + delay;
  [[1, 0.07], [2.01, 0.03], [3.98, 0.012]].forEach(([mul, amp]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = hz(m) * mul;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + 3.6);
  });
}
function thump(a) {
  const { ctx, master } = AU, t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(75, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.25);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6 * a, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.45);
}
function sceneSound(s, natural) {
  if (!AU.on) return;
  setChord(s);
  const S = SC[s];
  if (!natural) return;
  if (s > 0) whoosh(S.dur);
  if (S.flash) boom(S.flash);
  if (s > 0 && s < CHAPTERS) bell(CHORDS[s][4] + 12, S.dur * 0.85);
}
$('snd').addEventListener('click', async () => {
  const b = $('snd');
  try {
    if (!AU.ctx) audioInit();
    AU.on = !AU.on;
    const g = AU.master.gain, t = AU.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    if (AU.on) { await AU.ctx.resume(); setChord(sceneAt(T)); g.linearRampToValueAtTime(0.85, t + 1.2); }
    else g.linearRampToValueAtTime(0, t + 0.4);
    b.textContent = AU.on ? 'Sound on' : 'Sound off';
    b.setAttribute('aria-pressed', String(AU.on));
  } catch (err) { b.textContent = 'No audio'; }
});

/* ─────────────────────────  Frame  ───────────────────────── */
function bindTex(unit, t) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }
function drawTo(rt) { gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.fb : null); gl.viewport(0, 0, rt ? rt.w : canvas.width, rt ? rt.h : canvas.height); }
function blur(src, dst, dx, dy) {
  drawTo(dst);
  gl.uniform2f(P_BLUR.u.uDir, dx / dst.w, dy / dst.h);
  bindTex(0, src.t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function heartbeat(t) {
  const b = t % 1.1;
  return Math.exp(-b * 9) * 0.5 + (b > 0.2 ? Math.exp(-(b - 0.2) * 9) * 0.35 : 0);
}

let last = performance.now(), prevT = T;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) T += dt;
  let wrapped = false;
  if (T >= LOOP) { T -= LOOP; wrapped = true; }

  const s = sceneAt(T), S = SC[s], P = s > 0 ? SC[s - 1] : SC[0];
  if (s !== lastScene) {
    const natural = playing && (lastScene === s - 1 || (wrapped && s === 0));
    showCaption(s); sceneSound(s, natural);
    segEls.forEach((el, i) => el.classList.toggle('on', i === Math.min(s, CHAPTERS - 1)));
    lastScene = s;
  }
  // heartbeat sound in the opening
  if (AU.on && playing && s === 0 && !wrapped) {
    for (const off of [0, 0.2]) {
      const k0 = Math.floor((prevT - off) / 1.1), k1 = Math.floor((T - off) / 1.1);
      if (k1 > k0 && T - off >= 0) thump(off ? 0.6 : 1);
    }
  }
  prevT = T;

  const p = s === 0 ? 1 : clamp((T - S.t) / S.dur, 0, 1);
  const dts = T - S.t;
  const pk = smooth(p);
  const tint = P.tint.map((v, i) => mix(v, S.tint[i], pk));

  // opening: heartbeat, then anticipation squeeze before the bang
  let gscale = 1, preFlash = 0;
  if (s === 0 && T < SC[1].t) {
    const antic = smooth(clamp((T - (SC[1].t - 0.7)) / 0.7, 0, 1));
    gscale = (1 + heartbeat(T)) * (1 - 0.75 * antic);
    preFlash = antic * 0.08;
  }
  const rm = REDUCED ? 0.3 : 1;
  const flash = (S.flash ? S.flash * Math.exp(-dts * 5) * rm : 0) + preFlash;
  const shock = S.flash ? dts : -1;
  const shakeAmp = S.shake && !REDUCED ? S.shake * Math.exp(-dts * 2.2) * 0.14 : 0;

  // camera
  const aspect = canvas.width / canvas.height;
  const fit = clamp(1.95 / (5 * Math.tan(Math.PI / 8) * aspect), 1, 2.3);
  let [cd, yaw, pitch, roll, ty] = camera(T, s);
  yaw += 0.025 * Math.sin(now * 0.0003); pitch += 0.018 * Math.sin(now * 0.00023);
  cd *= fit;
  const sh = [Math.sin(now * 0.061) * shakeAmp, Math.sin(now * 0.047 + 1.3) * shakeAmp, Math.sin(now * 0.053 + 2.1) * shakeAmp];
  const tgt = [sh[0], ty + sh[1], sh[2]];
  const eye = [tgt[0] + cd * Math.cos(pitch) * Math.sin(yaw), tgt[1] + cd * Math.sin(pitch), tgt[2] + cd * Math.cos(pitch) * Math.cos(yaw)];
  const proj = perspective(Math.PI / 4, aspect, 0.05, 100);
  proj[9] = aspect > 1 ? -0.12 : -0.16; // lens shift: lift the subject clear of the caption
  const view = lookAt(eye, tgt, roll + sh[0] * 0.3);

  // mouse
  if (mouse.last && now - mouse.last > 1600) mouse.target = 0;
  mouse.z += (mouse.target - mouse.z) * Math.min(1, dt * 4);

  const pxScale = canvas.height / 1000;

  // 1 · background
  drawTo(RT.scene);
  gl.disable(gl.BLEND);
  gl.useProgram(P_BG.p);
  gl.uniform3fv(P_BG.u.uTint, tint);
  gl.uniform1f(P_BG.u.uTime, now / 1000);
  gl.uniform2f(P_BG.u.uRes, RT.scene.w, RT.scene.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2 · dust + particles, additive
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P_DUST.p);
  gl.uniformMatrix4fv(P_DUST.u.uProj, false, proj);
  gl.uniformMatrix4fv(P_DUST.u.uView, false, view);
  gl.uniform1f(P_DUST.u.uTime, now / 1000);
  gl.uniform1f(P_DUST.u.uPx, pxScale);
  gl.uniform3fv(P_DUST.u.uTint, tint);
  gl.drawArrays(gl.POINTS, 0, 1800);

  const U = P_PART.u;
  gl.useProgram(P_PART.p);
  bindTex(0, TEX_POS); gl.uniform1i(U.uPos, 0);
  bindTex(1, TEX_COL); gl.uniform1i(U.uCol, 1);
  gl.uniform1i(U.uFrom, s === 0 ? 0 : P.shape);
  gl.uniform1i(U.uTo, S.shape);
  gl.uniform1i(U.uTW, TW); gl.uniform1i(U.uTH, TH);
  gl.uniform1f(U.uP, p);
  gl.uniform1f(U.uStag, S.stag);
  gl.uniform1f(U.uTurb, S.turb * (REDUCED ? 0.5 : 1));
  gl.uniform1f(U.uSwirl, S.swirl * (REDUCED ? 0.5 : 1));
  gl.uniform1f(U.uTime, T);
  gl.uniform1f(U.uPx, pxScale);
  gl.uniform1f(U.uScale, gscale);
  gl.uniform1f(U.uEase, S.ease || 0);
  gl.uniform1f(U.uIntensity, 0.5 * (131072 / N));
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform3f(U.uMouse, mouse.x, mouse.y, mouse.z);
  gl.uniformMatrix4fv(U.uProj, false, proj);
  gl.uniformMatrix4fv(U.uView, false, view);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);

  // 3 · bloom + anamorphic streak
  gl.useProgram(P_BRIGHT.p);
  drawTo(RT.half);
  bindTex(0, RT.scene.t); gl.uniform1i(P_BRIGHT.u.uSrc, 0);
  gl.uniform2f(P_BRIGHT.u.uTexel, 1 / RT.scene.w, 1 / RT.scene.h);
  gl.uniform1f(P_BRIGHT.u.uThr, 0.32);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(P_BLUR.p);
  gl.uniform1i(P_BLUR.u.uSrc, 0);
  blur(RT.half, RT.a1, 1, 0); blur(RT.a1, RT.b1, 0, 1);
  blur(RT.b1, RT.a2, 1, 0); blur(RT.a2, RT.b2, 0, 1);
  blur(RT.b2, RT.a3, 1, 0); blur(RT.a3, RT.b3, 0, 1);
  blur(RT.b3, RT.a3, 2, 0); blur(RT.a3, RT.b3, 0, 2);
  blur(RT.b2, RT.sa, 1.5, 0); blur(RT.sa, RT.sb, 3, 0); blur(RT.sb, RT.sa, 6, 0); blur(RT.sa, RT.sb, 12, 0);

  // 4 · composite
  gl.useProgram(P_COMP.p);
  drawTo(null);
  const C = P_COMP.u;
  bindTex(0, RT.scene.t); gl.uniform1i(C.uScene, 0);
  bindTex(1, RT.b1.t); gl.uniform1i(C.uB1, 1);
  bindTex(2, RT.b2.t); gl.uniform1i(C.uB2, 2);
  bindTex(3, RT.b3.t); gl.uniform1i(C.uB3, 3);
  bindTex(4, RT.sb.t); gl.uniform1i(C.uS, 4);
  gl.uniform1f(C.uBloom, 0.95);
  gl.uniform1f(C.uStreak, 0.55);
  gl.uniform1f(C.uFlash, flash);
  gl.uniform1f(C.uTime, now / 1000);
  gl.uniform1f(C.uExposure, 1.35);
  gl.uniform1f(C.uShock, REDUCED ? -1 : shock);
  gl.uniform2f(C.uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);

  // HUD
  const fr = Math.floor((T % 1) * 24);
  $('tc').textContent = String(Math.floor(T / 60)).padStart(2, '0') + ':' + String(Math.floor(T % 60)).padStart(2, '0') + ':' + String(fr).padStart(2, '0');
  segEls.forEach((el, i) => {
    const a = SC[i].t, b = i === CHAPTERS - 1 ? LOOP : SC[i + 1].t;
    el.style.setProperty('--p', (clamp((T - a) / (b - a), 0, 1) * 100).toFixed(1) + '%');
  });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
