<title>福甘エビ丼 30秒CM</title>
<meta name="description" content="福井県三国港の「福甘エビ丼」を紹介する30秒のCM調モーショングラフィック。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07090C;
  --paper:#FFF6EA;
  --coral:#FF6F59;
  --dim:rgba(255,246,234,.6);
  --line:rgba(255,246,234,.2);
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden}
body{font-family:var(--gothic);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;box-sizing:border-box}
.stage{position:relative;width:min(100%,calc((100vh - 96px) * 16 / 9));aspect-ratio:16/9;max-width:100%;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl{width:min(100%,calc((100vh - 96px) * 16 / 9));display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.08em}
.btn{flex:none;appearance:none;background:none;border:1px solid var(--line);color:var(--paper);font:700 12px var(--gothic);letter-spacing:.1em;padding:8px 14px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--coral);color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:#ff8672;color:#fff}
.btn:focus-visible,.track:focus-visible{outline:1px solid var(--coral);outline-offset:3px}
.track{position:relative;flex:1;height:28px;cursor:pointer;min-width:60px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.track i{position:absolute;left:0;top:50%;height:2px;background:var(--coral);width:var(--p,0%)}
.track b{position:absolute;top:calc(50% - 4px);width:1px;height:10px;background:var(--dim)}
.tc{flex:none;font-variant-numeric:tabular-nums;color:var(--dim);min-width:92px;text-align:right}
@media (max-width:600px){.ctl{flex-wrap:wrap}.track{flex-basis:100%;order:3}}
</style>

<div class="stage"><canvas id="cv" aria-label="福甘エビ丼の30秒CM"></canvas></div>
<div class="ctl">
  <button class="btn primary" id="snd" type="button">音ありで最初から</button>
  <button class="btn" id="play" type="button">一時停止</button>
  <div class="track" id="track" role="slider" tabindex="0" aria-label="再生位置" aria-valuemin="0" aria-valuemax="30"><i></i></div>
  <div class="tc" id="tc">00:00 / 00:30</div>
</div>

<script>
(() => {
'use strict';
const W = 1920, H = 1080, DUR = 30;
const CUTS = [4.2, 8.2, 12.6, 17, 23.6];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ───────── helpers ───────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let seed = 7;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixC = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const MINCHO = '"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
const GOTHIC = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';
const DELA = '"Dela Gothic One","Zen Kaku Gothic New",sans-serif';

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* Kinetic text: each character pops in on its own beat. */
function kText(str, x, y, o) {
  const t = o.t, size = o.size;
  ctx.save();
  ctx.font = `${o.w || 900} ${size}px ${o.fam || MINCHO}`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = o.color || '#fff';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 30; }
  else if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; }
  const chars = [...str];
  const ws = chars.map(c => ctx.measureText(c).width + (o.track || 0));
  const total = ws.reduce((a, b) => a + b, 0) - (o.track || 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const out = o.out != null ? 1 - seg(t, o.out, o.out + .35) : 1;
  chars.forEach((ch, i) => {
    const k = seg(t, o.start + i * (o.stagger ?? .06), o.start + i * (o.stagger ?? .06) + (o.dur || .55));
    let px, py;
    if (o.vertical) {
      px = x; py = y + i * size * 1.08 + size / 2;
      if (ch === '、' || ch === '。') { px += size * .55; py -= size * .55; }
    } else { px = cx + ws[i] / 2 - (o.track || 0) / 2; py = y; cx += ws[i]; }
    if (k <= 0) return;
    const e = o.pop ? eBack(k) : eOut(k);
    ctx.save();
    ctx.globalAlpha = clamp(k * 1.6) * out * (o.alpha ?? 1);
    ctx.translate(px + (o.fromX || 0) * (1 - e), py + (o.fromY ?? size * .4) * (1 - e));
    const s = o.pop ? 1 + (1 - e) * o.pop : 1;
    ctx.scale(s, s);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  ctx.restore();
  return total;
}

function sparkle(x, y, r, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.4);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,220,180,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x, y - r * 2.4); ctx.quadraticCurveTo(x, y, x + r * 2.4, y); ctx.quadraticCurveTo(x, y, x, y + r * 2.4);
  ctx.quadraticCurveTo(x, y, x - r * 2.4, y); ctx.quadraticCurveTo(x, y, x, y - r * 2.4); ctx.fill();
  ctx.restore();
}

/* ───────── sprites ───────── */
const SW = 600, SH = 440;
function shrimpSprite(live, shadow) {
  const [c, x] = canvas(SW, SH);
  if (shadow) { x.shadowColor = 'rgba(70,25,10,.45)'; x.shadowBlur = 22; x.shadowOffsetY = 10; }
  const L = 330, Wd = 84, n = 7, steps = 70;
  const pts = []; let px = live ? 170 : 130, py = 150, a = -.35;
  for (let i = 0; i <= steps; i++) { pts.push({ x: px, y: py, a }); a += 1.3 / steps; px += Math.cos(a) * L / steps; py += Math.sin(a) * L / steps; }
  const at = s => pts[Math.round(clamp(s) * steps)];
  // tail fan
  const tp = at(1);
  for (let k = -2; k <= 2; k++) {
    x.save(); x.translate(tp.x, tp.y); x.rotate(tp.a + k * .32);
    const g = x.createLinearGradient(0, 0, 78, 0);
    g.addColorStop(0, '#ff7d5a'); g.addColorStop(.7, '#e8432b'); g.addColorStop(1, 'rgba(200,40,25,.85)');
    x.fillStyle = g; x.beginPath(); x.ellipse(40, 0, 42, 13 + (2 - Math.abs(k)) * 3, 0, 0, 7); x.fill();
    x.restore();
  }
  x.shadowColor = 'transparent';
  // smooth body outline (dorsal = local -y, the outer side of the curl)
  const wAt = s => Wd * (1 - .5 * s) * (s < .06 ? .8 + s / .06 * .2 : 1);
  const L1 = [], R1 = [];
  pts.forEach((p, i) => { const s = i / steps, w = wAt(s) / 2, nx = -Math.sin(p.a), ny = Math.cos(p.a);
    L1.push([p.x - nx * w, p.y - ny * w]); R1.push([p.x + nx * w, p.y + ny * w]); });
  const body = () => { x.beginPath(); L1.forEach(([X, Y], i) => i ? x.lineTo(X, Y) : x.moveTo(X, Y));
    for (let i = R1.length - 1; i >= 0; i--) x.lineTo(R1[i][0], R1[i][1]);
    const p0 = pts[0]; x.arc(p0.x, p0.y, wAt(0) / 2, p0.a + Math.PI / 2, p0.a - Math.PI / 2); x.closePath(); };
  if (shadow) { x.save(); x.shadowColor = 'rgba(70,25,10,.4)'; x.shadowBlur = 20; x.shadowOffsetY = 10; body(); x.fillStyle = '#ffc9b2'; x.fill(); x.restore(); }
  x.save(); body(); x.clip();
  x.fillStyle = live ? '#ff8a66' : '#ffd3c0'; x.fillRect(0, 0, SW, SH);
  // dorsal red band, fading to translucent flesh on the belly
  x.lineCap = 'round'; x.lineJoin = 'round';
  const band = (off, width, col) => { x.strokeStyle = col; x.lineWidth = width; x.beginPath();
    pts.forEach((p, i) => { const s = i / steps, w = wAt(s) / 2, nx = -Math.sin(p.a), ny = Math.cos(p.a);
      const X = p.x + nx * w * off, Y = p.y + ny * w * off; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.stroke(); };
  if (live) { band(-.75, 46, 'rgba(215,55,30,.8)'); band(.7, 30, 'rgba(255,190,160,.6)'); }
  else { band(-.85, 40, 'rgba(245,95,65,.85)'); band(-.35, 30, 'rgba(255,150,120,.45)'); band(.65, 34, 'rgba(255,240,232,.7)'); }
  // segment seams
  for (let i = 1; i < n; i++) {
    const s = i / n, p = at(s), w = wAt(s) / 2, nx = -Math.sin(p.a), ny = Math.cos(p.a), tx = Math.cos(p.a), ty = Math.sin(p.a);
    x.strokeStyle = live ? 'rgba(170,40,20,.45)' : 'rgba(215,80,55,.45)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(p.x - nx * w * 1.1, p.y - ny * w * 1.1);
    x.quadraticCurveTo(p.x + tx * 16, p.y + ty * 16, p.x + nx * w * 1.1, p.y + ny * w * 1.1); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(p.x - nx * w * 1.1 + tx * 5, p.y - ny * w * 1.1 + ty * 5);
    x.quadraticCurveTo(p.x + tx * 21, p.y + ty * 21, p.x + nx * w * 1.1 + tx * 5, p.y + ny * w * 1.1 + ty * 5); x.stroke();
  }
  band(-.3, 7, 'rgba(255,255,255,.7)');
  band(.1, 16, 'rgba(255,255,255,.12)');
  x.restore();
  if (live) {
    const p = pts[0], hw = Wd * 1.12, hl = 120;
    x.save(); x.translate(p.x, p.y); x.rotate(p.a);
    x.strokeStyle = '#ff8f70'; x.lineWidth = 2.5;
    for (const sgn of [-1, 1]) {
      x.beginPath(); x.moveTo(-hl * .9, -hw * .15);
      x.bezierCurveTo(-hl * 1.6, -hw * (1.4 + sgn * .2), -hl * .2, -hw * (2 + sgn * .3), hl * 2.4, -hw * (1.2 + sgn * .4)); x.stroke();
    }
    x.lineWidth = 3; x.strokeStyle = '#ff9a7c';
    for (let k = 0; k < 6; k++) { x.beginPath(); x.moveTo(-hl * .4 + k * 26, hw * .35); x.quadraticCurveTo(-hl * .4 + k * 26 + 10, hw * .75, -hl * .4 + k * 26 - 6, hw * .95); x.stroke(); }
    const g = x.createLinearGradient(0, -hw / 2, 0, hw / 2);
    g.addColorStop(0, '#e8452a'); g.addColorStop(.6, '#ff7a55'); g.addColorStop(1, '#ffa27f');
    x.fillStyle = g; x.beginPath(); x.ellipse(-hl * .45, 0, hl * .62, hw / 2, 0, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.45)'; x.beginPath(); x.ellipse(-hl * .5, -hw * .18, hl * .35, hw * .08, 0, 0, 7); x.fill();
    x.fillStyle = '#1a0a08'; x.beginPath(); x.arc(-hl * .92, -hw * .1, 8, 0, 7); x.fill();
    x.strokeStyle = '#e8452a'; x.lineWidth = 5; x.beginPath(); x.moveTo(-hl * .95, -hw * .25); x.lineTo(-hl * 1.4, -hw * .42); x.stroke();
    x.restore();
  }
  return c;
}
const SHRIMP = shrimpSprite(false, false);
const SHRIMP_SH = shrimpSprite(false, true);
const LIVE = shrimpSprite(true, false);
function drawSprite(img, x, y, s, r, flipY, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, flipY ? -s : s);
  ctx.drawImage(img, -SW / 2, -SH / 2); ctx.restore();
}

const BOWL = (() => {
  const [c, x] = canvas(1000, 1000);
  const g = x.createRadialGradient(500, 470, 380, 500, 500, 480);
  g.addColorStop(0, '#2a1a16'); g.addColorStop(.75, '#130b09'); g.addColorStop(.93, '#3b2621'); g.addColorStop(1, '#0a0605');
  x.fillStyle = g; x.beginPath(); x.arc(500, 500, 480, 0, 7); x.fill();
  x.strokeStyle = '#9b2318'; x.lineWidth = 10; x.beginPath(); x.arc(500, 500, 440, 0, 7); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 4; x.beginPath(); x.arc(500, 500, 470, 3.6, 5.2); x.stroke();
  x.fillStyle = '#efe6d8'; x.beginPath(); x.arc(500, 500, 424, 0, 7); x.fill();
  seed = 99;
  for (let i = 0; i < 9000; i++) {
    const r = Math.sqrt(rnd()) * 418, a = rnd() * 6.283;
    const gx = 500 + Math.cos(a) * r, gy = 500 + Math.sin(a) * r;
    x.save(); x.translate(gx, gy); x.rotate(rnd() * 3.14);
    x.fillStyle = 'rgba(160,140,115,.35)'; x.beginPath(); x.ellipse(1.5, 2, 10, 4.6, 0, 0, 7); x.fill();
    x.fillStyle = rnd() < .5 ? '#fffdf7' : '#f4ecdf'; x.beginPath(); x.ellipse(0, 0, 10, 4.6, 0, 0, 7); x.fill();
    x.restore();
  }
  const sh = x.createRadialGradient(500, 500, 250, 500, 500, 424);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(60,35,20,.35)');
  x.fillStyle = sh; x.beginPath(); x.arc(500, 500, 424, 0, 7); x.fill();
  return c;
})();

const WOOD = (() => {
  const [c, x] = canvas(W, H);
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#7a4b2a'); g.addColorStop(1, '#4e2c17');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  seed = 5;
  for (let i = 0; i < 160; i++) {
    const y0 = rnd() * H, amp = 6 + rnd() * 30, fr = .002 + rnd() * .004, ph = rnd() * 6;
    x.strokeStyle = rnd() < .5 ? `rgba(40,20,8,${.08 + rnd() * .15})` : `rgba(255,210,160,${.04 + rnd() * .07})`;
    x.lineWidth = 1 + rnd() * 3; x.beginPath();
    for (let X = -20; X <= W + 20; X += 20) { const Y = y0 + Math.sin(X * fr + ph) * amp + Math.sin(X * fr * 3.1) * amp * .2; X === -20 ? x.moveTo(X, Y) : x.lineTo(X, Y); }
    x.stroke();
  }
  const v = x.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c;
})();

/* bowl with shrimp arranged in two rings; `k` = seconds since first drop */
const RING = [];
for (let i = 0; i < 12; i++) RING.push({ r: 222, a: i / 12 * 6.283, s: .74, rot: i / 12 * 6.283 + 1.75, d: .16 + i * .14 });
for (let i = 0; i < 6; i++) RING.push({ r: 92, a: i / 6 * 6.283 + .5, s: .5, rot: i / 6 * 6.283 + 2.2, d: 1.95 + i * .12 });
function drawBowl(bx, by, bs, br, k) {
  ctx.save(); ctx.translate(bx, by); ctx.rotate(br); ctx.scale(bs, bs);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
  ctx.drawImage(BOWL, -500, -500); ctx.restore();
  for (const R of RING) {
    const p = seg(k, R.d, R.d + .45); if (p <= 0) continue;
    const e = eBack(p);
    drawSprite(SHRIMP_SH, Math.cos(R.a) * R.r, Math.sin(R.a) * R.r - (1 - eOut(p)) * 160, R.s * (1 + (1 - e) * .5), R.rot, false, clamp(p * 2));
  }
  ctx.restore();
}

/* precomputed particles */
seed = 11;
const STARS = Array.from({ length: 140 }, () => [rnd() * W, rnd() * 600, rnd() * 1.8 + .4, rnd() * 6]);
const GLINTS = Array.from({ length: 110 }, () => [rnd() * W, 600 + Math.pow(rnd(), 1.5) * 480, rnd() * 6, 2 + rnd() * 5]);
const SNOW = Array.from({ length: 110 }, () => [rnd() * W, rnd() * H, 1 + rnd() * 3.5, .3 + rnd() * .7, rnd() * 6]);
const JUMPS = [
  { t0: .2, x0: 700, dx: 380, h: 400, s: .78 }, { t0: .6, x0: 1450, dx: -340, h: 330, s: .6 },
  { t0: 1.05, x0: 980, dx: 440, h: 470, s: .9 }, { t0: 1.5, x0: 1250, dx: 320, h: 300, s: .55 },
  { t0: 1.95, x0: 820, dx: -360, h: 380, s: .72 }, { t0: 2.4, x0: 1180, dx: 400, h: 430, s: .82 },
];
for (const j of JUMPS) j.x0 += 260;
for (const j of JUMPS) j.drops = Array.from({ length: 16 }, () => [(rnd() - .5) * 520, -300 - rnd() * 520, 3 + rnd() * 5]);
const FROST = [];
(function frost() {
  seed = 21;
  const grow = (x, y, a, len, depth, d) => {
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    FROST.push([x, y, x2, y2, d, depth]);
    if (depth < 5) { grow(x2, y2, a + .55 + rnd() * .3, len * .62, depth + 1, d + .12); grow(x2, y2, a - .55 - rnd() * .3, len * .62, depth + 1, d + .12); grow(x2, y2, a + (rnd() - .5) * .3, len * .8, depth + 1, d + .1); }
  };
  for (let i = 0; i < 14; i++) {
    const side = i % 4, u = rnd();
    const [x, y, a] = side === 0 ? [u * W, 0, 1.57] : side === 1 ? [W, u * H, 3.14] : side === 2 ? [u * W, H, -1.57] : [0, u * H, 0];
    grow(x, y, a + (rnd() - .5) * .6, 90 + rnd() * 70, 0, 0);
  }
})();
const SPARK = Array.from({ length: 14 }, () => [rnd(), rnd(), rnd()]);

/* ───────── scenes ───────── */
function sea(t, top, cTop, cBot, lineCol, bright) {
  const g = ctx.createLinearGradient(0, top, 0, H); g.addColorStop(0, cTop); g.addColorStop(1, cBot);
  ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top);
  ctx.lineWidth = 2;
  for (let j = 0; j < 28; j++) {
    const y = top + 8 + j * j * .62, amp = 1 + j * .28;
    ctx.strokeStyle = lineCol.replace('A', (.05 + .12 * j / 28 * bright).toFixed(3));
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { const Y = y + Math.sin(x * .01 + t * 1.6 + j) * amp; x ? ctx.lineTo(x, Y) : ctx.moveTo(x, Y); }
    ctx.stroke();
  }
}

function s1(t, d) {           // 日本海、福井。
  const dawn = eIO(seg(t, 0, 3.4)), z = 1 + .05 * t / d;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const HZ = 640;
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, mixC('#050b18', '#173a66', dawn)); g.addColorStop(.7, mixC('#0d1a33', '#7a6283', dawn)); g.addColorStop(1, mixC('#1a2440', '#ff9a62', dawn));
  ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, HZ + 100);
  for (const [x, y, r, p] of STARS) { ctx.globalAlpha = (1 - dawn) * (.5 + .5 * Math.sin(t * 3 + p)); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, r, r); }
  ctx.globalAlpha = 1;
  const sx = 1240, sy = 700 - 130 * dawn;
